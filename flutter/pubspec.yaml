name: sailor_desktop
description: Desktop client for Sailor secure file transfer protocol.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  ffi: ^2.1.2
  file_picker: ^8.0.0
  path: ^1.9.0
  shared_preferences: ^2.2.3
  window_manager: ^0.3.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
